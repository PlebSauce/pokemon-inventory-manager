[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-inventory"
version = "0.1.0"
description = "Pokemon card inventory management application"
requires-python = ">=3.12"
dependencies = [
    "SQLAlchemy>=2.1.1",
    "fastapi>=0.110.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx<0.28.0,>=0.27.0",
]

[project.scripts]
pokemon = "pokemon_inventory.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]